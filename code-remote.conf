# code-remote configuration — edit me.
# Sourced by bin/code-remote (runs on your LOCAL machine).

# The bootstrap repo itself — cloned ON the remote host by the bootstrap flow
# (public https, no keys; secrets never come from a repo).
CODE_REMOTE_REPO="https://github.com/ruben-hutter/code-remote"

# Sync pi auth.json (API keys) to remotes. Default 0: a remote keeps its OWN
# credentials; auth.json is only pushed when the remote has none. Setting 1
# still never overwrites an existing remote auth.json.
SYNC_PI_AUTH=1

# pi config files synced to ~/.pi/agent/ on the remote. Note: auth.json keys
# stored as "!pass show …" commands are resolved LOCALLY at sync time and
# written to the remote auth.json as literal keys (no pass on remotes).
PI_FILES=(settings.json keybindings.json AGENTS.md trust.json models-store.json)

# Env vars written to the remote as a plain env file (~/.config/code-remote/
# passenv, sourced by the managed bashrc block), resolved from pass at sync
# time. For providers whose auth reads the environment instead of auth.json
# (mirrors fish 00-env.fish locally). Format: VAR:pass-entry
PASS_ENVARS=("OPENROUTER_API_KEY:openrouter/api-key")

# Subdirectories of ~/.pi/agent/extensions/ that stay LOCAL ONLY.
# notify.ts: pi desktop-notification extension — remotes have no notification
# support by design (notify-send shim removed); excluded so it never lands there.
PI_EXCLUDES=(--exclude=gondolin --exclude=blink1.ts --exclude=notify.ts)

# tmux session used by `code-remote connect` when the remote does NOT have
# ~/scripts/tmux_session_manager.sh (which is preferred when present).
TMUX_SESSION=home
